<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Buddy AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 550px; }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Typography */
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.subtitle { color: var(--text-dim); text-align: center; font-size: 14px; margin-bottom: 30px; }

    /* Inputs & Buttons */
    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-next { background: rgba(255, 255, 255, 0.1); color: white; margin-top: 20px; display: none; }
    .btn-next:hover { background: rgba(255, 255, 255, 0.2); }

    /* Quiz Area */
    #quiz-area, #loading, #results { display: none; }

    .progress-container { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

    .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .question { font-size: 18px; font-weight: 500; line-height: 1.5; margin-bottom: 25px; }

    .options-grid { display: grid; gap: 12px; }
    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 15px;
    }
    .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: var(--primary); }
    .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #86efac; }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: #fca5a5; }

    /* Loading Spinner */
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(56, 189, 248, 0.3); border-radius: 50%;
      border-top-color: var(--primary); animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .score-circle {
      width: 120px; height: 120px; border: 8px solid rgba(56, 189, 248, 0.1); border-radius: 50%;
      margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-top-color: var(--primary);
    }
    .score-big { font-size: 32px; font-weight: 700; color: var(--primary); }
    .feedback-text { font-size: 14px; color: var(--text-dim); margin-top: 15px; line-height: 1.6; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 25px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- Setup Screen -->
    <div id="setup">
      <h1>Quiz Buddy</h1>
      <p class="subtitle">AI-powered knowledge testing</p>
      <input type="text" id="topic-input" placeholder="e.g. Space Exploration, Python, 90s Music">
      <button class="btn btn-primary" onclick="startQuiz()">
        Generate Quiz 
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

    <!-- Loading Screen -->
    <div id="loading" style="text-align: center;">
      <div class="spinner"></div>
      <p>AI is crafting your quiz...</p>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-area">
      <div class="stats">
        <span id="q-number">Question 1/5</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="progress-container"><div class="progress-fill" id="progress-bar"></div></div>
      
      <p class="question" id="question-text"></p>
      
      <div class="options-grid" id="options-container"></div>
      
      <p id="explanation" class="feedback-text" style="display: none;"></p>
      
      <button id="next-btn" class="btn btn-next" onclick="nextQuestion()">
        Next Question
      </button>
    </div>

    <!-- Results Screen -->
    <div id="results" style="text-align: center;">
      <h1>Quiz Complete!</h1>
      <p class="subtitle" id="result-topic"></p>
      
      <div class="score-circle">
        <span class="score-big" id="final-score">0/5</span>
        <span style="font-size: 12px; color: var(--text-dim)">CORRECT</span>
      </div>
      
      <p id="result-comment" style="margin-bottom: 30px;"></p>
      
      <button class="btn btn-primary" onclick="restart()">Try Another Topic</button>
    </div>

  </div>
</div>


<script>
  let questions = [];
  let currentIdx = 0;
  let score = 0;

  // --- API PROTECTION SETTINGS ---
  const DAILY_LIMIT = 10; 
  const COOLDOWN_MINUTES = 1; // Prevent rapid-fire clicking

  function getDailyCount() {
    const today = new Date().toDateString();
    const data = JSON.parse(localStorage.getItem('quiz_usage') || '{}');
    return data.date === today ? data.count : 0;
  }

  function incrementUsage() {
    const today = new Date().toDateString();
    const count = getDailyCount() + 1;
    localStorage.setItem('quiz_usage', JSON.stringify({ date: today, count }));
  }

  function showSection(id) {
    ['setup', 'loading', 'quiz-area', 'results'].forEach(sec => {
      document.getElementById(sec).style.display = sec === id ? 'block' : 'none';
    });
  }

  async function startQuiz() {
    const topicInput = document.getElementById('topic-input');
    const topic = topicInput.value.trim().toLowerCase();
    
    if (!topic) return alert("Please enter a topic!");

    // 1. Check Daily Limit
    if (getDailyCount() >= DAILY_LIMIT) {
      return alert(`Daily limit reached (${DAILY_LIMIT} quizzes). Please come back tomorrow!`);
    }

    // 2. Check Cache (Saves API usage for repeat topics)
    const cached = localStorage.getItem(`cache_${topic}`);
    if (cached) {
      console.log("Loading from cache...");
      questions = JSON.parse(cached);
      startQuizLogic();
      return;
    }

    showSection('loading');

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic })
      });

      if (!response.ok) throw new Error("Failed to generate quiz");

      questions = await response.json();
      
      // Save to cache and increment usage
      localStorage.setItem(`cache_${topic}`, JSON.stringify(questions));
      incrementUsage();
      
      startQuizLogic();
    } catch (error) {
      alert("Error: " + error.message);
      showSection('setup');
    }
  }

  function startQuizLogic() {
    currentIdx = 0;
    score = 0;
    showSection('quiz-area');
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentIdx];
    const total = questions.length;
    
    // FIX: Reset button text every time to prevent the "See Final Results" bug
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = "Next Question"; 
    nextBtn.style.display = 'none';

    document.getElementById('q-number').textContent = `Question ${currentIdx + 1}/${total}`;
    document.getElementById('score-display').textContent = `Score: ${score}`;
    document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / total) * 100}%`;
    
    document.getElementById('question-text').textContent = q.q;
    document.getElementById('explanation').style.display = 'none';

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(i, btn);
      container.appendChild(btn);
    });
  }

  function handleAnswer(selectedIdx, clickedBtn) {
    const q = questions[currentIdx];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => btn.disabled = true);

    const isCorrect = selectedIdx === q.answer;
    if (isCorrect) {
      clickedBtn.classList.add('correct');
      score++;
    } else {
      clickedBtn.classList.add('wrong');
      buttons[q.answer].classList.add('correct');
    }

    const exp = document.getElementById('explanation');
    exp.textContent = (isCorrect ? "✨ Correct! " : "❌ Oops! ") + q.explanation;
    exp.style.display = 'block';

    document.getElementById('score-display').textContent = `Score: ${score}`;
    
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'flex';
    
    // FIX: Only change text on the actual last question
    if (currentIdx === questions.length - 1) {
      nextBtn.textContent = "See Final Results";
    }
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    showSection('results');
    document.getElementById('final-score').textContent = `${score}/${questions.length}`;
    const percent = (score / questions.length) * 100;
    let msg = "Keep practicing!";
    if (percent === 100) msg = "Perfect Score! You're a Master.";
    else if (percent >= 80) msg = "Great job! You really know this.";
    else if (percent >= 50) msg = "Not bad! A little more study and you'll be there.";
    
    document.getElementById('result-comment').textContent = msg;
  }

  function restart() {
    document.getElementById('topic-input').value = '';
    showSection('setup');
  }
</script>

</body>
</html>
